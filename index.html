<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#1E3A5F" />
  <meta name="description" content="Aplikasi belajar 16 tenses bahasa Inggris lengkap dengan penjelasan detail, diagram garis waktu, contoh kalimat beraudio, dan latihan soal interaktif tingkat Dasar, Menengah, dan Mahir." />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="TenseMaster" />
  <link rel="manifest" href="./manifest.json" />
  <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png" />
  <link rel="apple-touch-icon" href="./icon-192.png" />
  <title>TenseMaster — Belajar 16 Tenses Bahasa Inggris</title>
  <style>
    :root {
      --bg: #FAF8F3;
      --surface: #F3EFE6;
      --card: #FFFFFF;
      --surface-high: #EBE5D8;
      --ink: #18202C;
      --muted: #526071;
      --outline: #D6CFC0;

      --primary: #1E3A5F;
      --on-primary: #FFFFFF;
      --primary-container: #D6E4F7;
      --on-primary-container: #0E213A;

      --present: #0F766E;
      --present-bg: #CCFBF1;
      --past: #C2410C;
      --past-bg: #FFEDD5;
      --future: #1D4ED8;
      --future-bg: #DBEAFE;
      --past-future: #6D28D9;
      --past-future-bg: #EDE9FE;

      --beginner: #15803D;
      --beginner-bg: #DCFCE7;
      --intermediate: #B45309;
      --intermediate-bg: #FEF3C7;
      --advanced: #9F1239;
      --advanced-bg: #FFE4E6;

      --success: #15803D;
      --success-bg: #DCFCE7;
      --error: #BE123C;
      --error-bg: #FFE4E6;
      --gold: #F59E0B;
      --gold-bg: rgba(245, 158, 11, 0.14);

      --shadow-sm: 0 2px 10px rgba(24, 32, 44, 0.05);
      --shadow-md: 0 8px 24px rgba(24, 32, 44, 0.08);
      --radius-sm: 10px;
      --radius-md: 16px;
      --radius-lg: 22px;
      --font-display: ui-rounded, 'SF Pro Rounded', 'Segoe UI', system-ui, -apple-system, sans-serif;
      --font-body: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      --font-mono: ui-monospace, 'SFMono-Regular', Menlo, Monaco, Consolas, monospace;
      --nav-height: 70px;
      --rail-width: 228px;
    }

    [data-theme="dark"] {
      --bg: #11161F;
      --surface: #18202B;
      --card: #1E2836;
      --surface-high: #283446;
      --ink: #F1F5F9;
      --muted: #94A3B8;
      --outline: #334155;

      --primary: #93C5FD;
      --on-primary: #0C223D;
      --primary-container: #1E3A5F;
      --on-primary-container: #DBEAFE;

      --present: #5EEAD4;
      --present-bg: #134E4A;
      --past: #FB923C;
      --past-bg: #7C2D12;
      --future: #60A5FA;
      --future-bg: #1E3A8A;
      --past-future: #A78BFA;
      --past-future-bg: #4C1D95;

      --beginner: #4ADE80;
      --beginner-bg: #14532D;
      --intermediate: #FBBF24;
      --intermediate-bg: #78350F;
      --advanced: #FB7185;
      --advanced-bg: #881337;

      --success: #4ADE80;
      --success-bg: #14532D;
      --error: #FB7185;
      --error-bg: #881337;
      --gold: #FBBF24;
      --gold-bg: rgba(251, 191, 36, 0.16);

      --shadow-sm: 0 2px 10px rgba(0, 0, 0, 0.25);
      --shadow-md: 0 8px 24px rgba(0, 0, 0, 0.35);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: var(--font-body);
      line-height: 1.5;
      min-height: 100vh;
    }

    button, input {
      font-family: inherit;
      color: inherit;
    }

    button {
      cursor: pointer;
      border: none;
      background: none;
    }

    .app-shell {
      display: flex;
      min-height: 100vh;
    }

    /* Desktop Navigation Rail */
    .side-rail {
      display: none;
      width: var(--rail-width);
      flex-shrink: 0;
      background: var(--card);
      border-right: 1px solid var(--outline);
      padding: 20px 14px;
      position: fixed;
      inset: 0 auto 0 0;
      flex-direction: column;
      gap: 8px;
      z-index: 30;
    }

    .rail-brand {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 8px 10px 18px;
      border-bottom: 1px solid var(--outline);
      margin-bottom: 8px;
    }

    .rail-brand img {
      width: 40px;
      height: 40px;
      border-radius: 12px;
    }

    .rail-brand h1 {
      margin: 0;
      font-family: var(--font-display);
      font-size: 1.15rem;
      font-weight: 800;
      color: var(--ink);
    }

    .rail-brand span {
      display: block;
      font-size: 0.72rem;
      color: var(--muted);
    }

    .nav-btn {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 14px;
      border-radius: 14px;
      font-size: 0.92rem;
      font-weight: 600;
      color: var(--muted);
      transition: background 0.18s, color 0.18s;
      min-height: 48px;
      width: 100%;
      text-align: left;
    }

    .nav-btn:hover {
      background: var(--surface);
      color: var(--ink);
    }

    .nav-btn.active {
      background: var(--primary-container);
      color: var(--on-primary-container);
    }

    .rail-footer {
      margin-top: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding-top: 12px;
      border-top: 1px solid var(--outline);
    }

    /* Main Content Area */
    .main-area {
      flex: 1;
      width: 100%;
      padding-bottom: calc(var(--nav-height) + env(safe-area-inset-bottom, 0px) + 16px);
    }

    .top-bar {
      position: sticky;
      top: 0;
      z-index: 20;
      background: color-mix(in srgb, var(--bg) 90%, transparent);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--outline);
      padding: calc(10px + env(safe-area-inset-top, 0px)) 16px 10px;
    }

    .top-bar-inner {
      max-width: 780px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .brand-mini {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-mini img {
      width: 34px;
      height: 34px;
      border-radius: 10px;
    }

    .brand-mini-title {
      font-family: var(--font-display);
      font-size: 1.08rem;
      font-weight: 800;
      margin: 0;
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .icon-btn {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: var(--card);
      border: 1px solid var(--outline);
      color: var(--ink);
      transition: transform 0.12s, background 0.15s;
      flex-shrink: 0;
    }

    .icon-btn:active {
      transform: scale(0.95);
    }

    .install-pill {
      display: none;
      align-items: center;
      gap: 6px;
      padding: 8px 12px;
      border-radius: 999px;
      background: var(--primary);
      color: var(--on-primary);
      font-size: 0.8rem;
      font-weight: 700;
      min-height: 38px;
    }

    .install-pill.visible {
      display: inline-flex;
    }

    .container {
      max-width: 780px;
      margin: 0 auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    /* Mobile Bottom Navigation */
    .bottom-nav {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 30;
      background: var(--card);
      border-top: 1px solid var(--outline);
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      padding: 6px 8px calc(8px + env(safe-area-inset-bottom, 0px));
    }

    .bottom-nav.hidden {
      display: none;
    }

    .bottom-tab {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      padding: 6px 4px;
      min-height: 52px;
      border-radius: 14px;
      font-size: 0.72rem;
      font-weight: 600;
      color: var(--muted);
    }

    .bottom-tab .tab-pill {
      padding: 4px 16px;
      border-radius: 999px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: background 0.18s;
    }

    .bottom-tab.active {
      color: var(--ink);
    }

    .bottom-tab.active .tab-pill {
      background: var(--primary-container);
      color: var(--on-primary-container);
    }

    @media (min-width: 760px) {
      .side-rail {
        display: flex;
      }
      .main-area {
        margin-left: var(--rail-width);
        padding-bottom: 32px;
      }
      .bottom-nav {
        display: none !important;
      }
      .brand-mini {
        display: none;
      }
    }

    /* Editorial Cards & Components */
    .card {
      background: var(--card);
      border: 1px solid var(--outline);
      border-radius: var(--radius-lg);
      padding: 18px;
      box-shadow: var(--shadow-sm);
    }

    .hero-card {
      position: relative;
      overflow: hidden;
      border-radius: 26px;
      padding: 24px 22px;
      background: linear-gradient(130deg, #132843 0%, #1E3A5F 56%, #0F766E 100%);
      color: #FFFFFF;
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: var(--shadow-md);
    }

    .hero-card::after {
      content: "";
      position: absolute;
      right: -32px;
      top: -32px;
      width: 210px;
      height: 210px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(245, 158, 11, 0.34) 0%, rgba(245, 158, 11, 0) 70%);
      pointer-events: none;
    }

    .hero-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 12px;
      border-radius: 999px;
      background: rgba(245, 158, 11, 0.2);
      border: 1px solid rgba(253, 230, 138, 0.4);
      color: #FDE68A;
      font-size: 0.76rem;
      font-weight: 700;
      margin-bottom: 12px;
    }

    .hero-title {
      font-family: var(--font-display);
      font-size: 1.5rem;
      line-height: 1.25;
      margin: 0 0 8px;
      max-width: 520px;
    }

    .hero-desc {
      margin: 0;
      font-size: 0.88rem;
      color: rgba(255, 255, 255, 0.86);
      max-width: 500px;
    }

    .section-title {
      font-family: var(--font-display);
      font-size: 1.18rem;
      font-weight: 700;
      margin: 0 0 4px;
    }

    .section-sub {
      margin: 0;
      font-size: 0.84rem;
      color: var(--muted);
    }

    .row {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .row-between {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }

    .progress-track {
      width: 100%;
      height: 10px;
      background: var(--surface-high);
      border-radius: 999px;
      overflow: hidden;
      margin: 12px 0;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--present), var(--future));
      border-radius: 999px;
      transition: width 0.35s ease;
    }

    .stat-pill {
      flex: 1;
      background: var(--surface);
      border-radius: 14px;
      padding: 10px 12px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .stat-pill small {
      display: block;
      font-size: 0.72rem;
      color: var(--muted);
    }

    .stat-pill strong {
      font-size: 0.92rem;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 4px 9px;
      border-radius: 8px;
      font-size: 0.73rem;
      font-weight: 700;
      white-space: nowrap;
    }

    .badge-present { color: var(--present); background: var(--present-bg); }
    .badge-past { color: var(--past); background: var(--past-bg); }
    .badge-future { color: var(--future); background: var(--future-bg); }
    .badge-past_future { color: var(--past-future); background: var(--past-future-bg); }

    .badge-beginner { color: var(--beginner); background: var(--beginner-bg); }
    .badge-intermediate { color: var(--intermediate); background: var(--intermediate-bg); }
    .badge-advanced { color: var(--advanced); background: var(--advanced-bg); }

    .badge-neutral { color: var(--muted); background: var(--surface); }

    .formula-box {
      background: var(--surface);
      border: 1px solid var(--outline);
      border-radius: 12px;
      padding: 10px 12px;
      font-family: var(--font-mono);
      font-size: 0.84rem;
      font-weight: 600;
      word-break: break-word;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 46px;
      padding: 10px 16px;
      border-radius: 14px;
      font-size: 0.9rem;
      font-weight: 700;
      transition: opacity 0.15s, transform 0.12s;
    }

    .btn:active { transform: scale(0.98); }
    .btn:disabled { opacity: 0.45; cursor: not-allowed; }
    .btn-primary { background: var(--primary); color: var(--on-primary); }
    .btn-tonal { background: var(--primary-container); color: var(--on-primary-container); }
    .btn-gold { background: var(--gold); color: #1A1202; }
    .btn-success { background: var(--success); color: #FFFFFF; }
    .btn-outline { background: transparent; border: 1px solid var(--outline); color: var(--ink); }
    .btn-full { width: 100%; }

    .bento-card {
      background: var(--card);
      border: 1px solid var(--outline);
      border-radius: 20px;
      padding: 14px;
      text-align: left;
      width: 100%;
      transition: transform 0.15s, border-color 0.15s;
    }

    .bento-card:hover {
      border-color: var(--primary);
      transform: translateY(-1px);
    }

    .tense-card {
      background: var(--card);
      border: 1px solid var(--outline);
      border-radius: 20px;
      padding: 16px;
      cursor: pointer;
      transition: border-color 0.16s, transform 0.14s;
    }

    .tense-card:hover {
      border-color: var(--primary);
      transform: translateY(-1px);
    }

    .num-pill {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-display);
      font-weight: 800;
      font-size: 0.92rem;
      flex-shrink: 0;
    }

    .search-input {
      width: 100%;
      padding: 13px 16px;
      border-radius: 16px;
      border: 1px solid var(--outline);
      background: var(--card);
      font-size: 0.94rem;
      outline: none;
    }

    .search-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px color-mix(in srgb, var(--primary) 16%, transparent);
    }

    .chip-scroll {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 4px;
      scrollbar-width: none;
    }
    .chip-scroll::-webkit-scrollbar { display: none; }

    .chip {
      padding: 8px 14px;
      border-radius: 999px;
      border: 1px solid var(--outline);
      background: var(--card);
      font-size: 0.82rem;
      font-weight: 600;
      white-space: nowrap;
      min-height: 38px;
      color: var(--muted);
    }

    .chip.active {
      background: var(--primary);
      color: var(--on-primary);
      border-color: var(--primary);
    }

    .tabs-bar {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      background: var(--surface);
      padding: 5px;
      border-radius: 16px;
      scrollbar-width: none;
    }
    .tabs-bar::-webkit-scrollbar { display: none; }

    .seg-tab {
      flex: 1;
      min-width: max-content;
      padding: 10px 14px;
      border-radius: 12px;
      font-size: 0.84rem;
      font-weight: 700;
      color: var(--muted);
      transition: background 0.15s, color 0.15s;
    }

    .seg-tab.active {
      background: var(--card);
      color: var(--ink);
      box-shadow: var(--shadow-sm);
    }

    .timeline-box {
      background: var(--card);
      border: 1px solid var(--outline);
      border-radius: 18px;
      padding: 16px;
    }

    .timeline-labels {
      display: flex;
      justify-content: space-between;
      font-size: 0.68rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      color: var(--muted);
      margin-top: 4px;
    }

    .speak-btn {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: var(--primary-container);
      color: var(--on-primary-container);
      flex-shrink: 0;
    }

    .speak-btn:active { transform: scale(0.92); }

    .highlight-verb {
      padding: 1px 6px;
      border-radius: 6px;
      font-weight: 800;
    }

    .signals-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .signal-chip {
      background: var(--card);
      border: 1px solid var(--outline);
      border-radius: 12px;
      padding: 8px 12px;
    }

    .signal-chip strong {
      display: block;
      font-size: 0.85rem;
    }

    .signal-chip span {
      font-size: 0.75rem;
      color: var(--muted);
    }

    .mistake-bad {
      background: var(--error-bg);
      color: var(--ink);
      border-radius: 12px;
      padding: 10px 12px;
      font-weight: 600;
      font-size: 0.9rem;
    }

    .mistake-good {
      background: var(--success-bg);
      color: var(--ink);
      border-radius: 12px;
      padding: 10px 12px;
      font-weight: 600;
      font-size: 0.9rem;
    }

    .tip-card {
      background: var(--gold-bg);
      border: 1px solid color-mix(in srgb, var(--gold) 50%, transparent);
      border-radius: 18px;
      padding: 16px;
    }

    /* Quiz UI */
    .quiz-option {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px;
      border-radius: 16px;
      background: var(--card);
      border: 1.5px solid var(--outline);
      text-align: left;
      font-size: 0.96rem;
      font-weight: 600;
      transition: border-color 0.14s, background 0.14s;
    }

    .quiz-option.selected {
      background: var(--primary-container);
      border-color: var(--primary);
    }

    .quiz-option.correct {
      background: var(--success-bg);
      border-color: var(--success);
    }

    .quiz-option.wrong {
      background: var(--error-bg);
      border-color: var(--error);
    }

    .opt-letter {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: var(--surface);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 0.82rem;
      font-weight: 800;
      flex-shrink: 0;
    }

    .spot-wrap {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .spot-chip {
      padding: 12px 16px;
      border-radius: 14px;
      background: var(--card);
      border: 1.5px solid var(--outline);
      font-size: 0.92rem;
      font-weight: 700;
    }

    .spot-chip.selected { background: var(--primary-container); border-color: var(--primary); }
    .spot-chip.correct { background: var(--success-bg); border-color: var(--success); }
    .spot-chip.wrong { background: var(--error-bg); border-color: var(--error); }

    .builder-zone {
      min-height: 82px;
      border-radius: 18px;
      border: 1.5px dashed var(--outline);
      background: var(--surface);
      padding: 12px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
    }

    .builder-zone.correct { border-style: solid; border-color: var(--success); background: var(--success-bg); }
    .builder-zone.wrong { border-style: solid; border-color: var(--error); background: var(--error-bg); }

    .word-token {
      padding: 10px 14px;
      border-radius: 12px;
      font-size: 0.9rem;
      font-weight: 700;
      border: 1px solid var(--outline);
      background: var(--card);
    }

    .word-token.placed {
      background: var(--primary);
      color: var(--on-primary);
      border-color: var(--primary);
    }

    .feedback-card {
      border-radius: 20px;
      padding: 16px;
      border: 1.5px solid;
    }

    .feedback-card.ok {
      background: var(--success-bg);
      border-color: var(--success);
    }

    .feedback-card.bad {
      background: var(--error-bg);
      border-color: var(--error);
    }

    .drill-scroll {
      display: flex;
      gap: 12px;
      overflow-x: auto;
      padding: 4px 0 8px;
    }

    .drill-card {
      min-width: 210px;
      max-width: 210px;
      background: var(--card);
      border: 1px solid var(--outline);
      border-radius: 18px;
      padding: 14px;
      text-align: left;
      flex-shrink: 0;
    }

    .empty-state {
      text-align: center;
      padding: 40px 20px;

      { id: 'b4', tenseId: 'present_continuous', tenseName: 'Present Continuous Tense', level: 'beginner', type: 'mc', inst: 'Lengkapi kalimat tentang aktivitas yang sedang berlangsung saat ini.', prompt: 'Be quiet, please! The baby _____ in the bedroom right now.', options: ['sleeps', 'is sleeping', 'slept', 'sleep'], ans: 'is sleeping', exp: '"Be quiet!" dan "right now" menandakan aktivitas sedang berlangsung detik ini → Present Continuous (is sleeping).', hint: 'S + am/is/are + V-ing', spoken: 'Be quiet, please! The baby is sleeping in the bedroom right now.' },
      { id: 'b5', tenseId: 'present_continuous', tenseName: 'Present Continuous Tense', level: 'beginner', type: 'spot', inst: 'Pilih bagian kalimat yang tidak tepat secara gramatikal.', prompt: 'I am knowing the right answer to this geography question.', options: ['I', 'am knowing', 'the right answer', 'geography question'], ans: 'am knowing', exp: '"Know" adalah stative verb yang tidak boleh memakai -ing. Seharusnya: "I know the right answer."', hint: 'Stative verbs (know, love, want) → Simple Present', spoken: 'I know the right answer to this geography question.' },
      { id: 'b6', tenseId: 'present_continuous', tenseName: 'Present Continuous Tense', level: 'beginner', type: 'builder', inst: 'Susun kata berikut menjadi kalimat tanya Present Continuous yang tepat.', prompt: 'Terjemahan: Apakah kamu sedang menunggu kereta sekarang?', bank: ['waiting', 'now', 'Are', 'the train', 'you', 'for'], ans: 'Are you waiting for the train now', exp: 'Kalimat tanya Present Continuous diawali to be "Are" + subjek "you" + V-ing "waiting".', hint: 'Am/Is/Are + S + V-ing?', spoken: 'Are you waiting for the train now?' },

      { id: 'b7', tenseId: 'simple_past', tenseName: 'Simple Past Tense', level: 'beginner', type: 'mc', inst: 'Pilih bentuk kata kerja lampau yang benar.', prompt: 'We _____ a fascinating history museum in Yogyakarta last month.', options: ['visit', 'visited', 'are visiting', 'have visit'], ans: 'visited', exp: '"Last month" menunjukkan kejadian selesai spesifik di masa lalu → Simple Past (V2: visited).', hint: 'S + V2 + O (last month)', spoken: 'We visited a fascinating history museum in Yogyakarta last month.' },
      { id: 'b8', tenseId: 'simple_past', tenseName: 'Simple Past Tense', level: 'beginner', type: 'spot', inst: 'Temukan kata yang salah dalam kalimat negatif lampau ini.', prompt: "Rina didn't went to the bookstore yesterday afternoon.", options: ['Rina', "didn't", 'went', 'yesterday afternoon'], ans: 'went', exp: 'Setelah "didn\'t", kata kerja wajib kembali ke V1 yaitu "go", bukan V2 "went".', hint: "S + did not (didn't) + V1", spoken: "Rina didn't go to the bookstore yesterday afternoon." },
      { id: 'b9', tenseId: 'simple_past', tenseName: 'Simple Past Tense', level: 'beginner', type: 'builder', inst: 'Susun kata berikut menjadi kalimat Simple Past yang benar.', prompt: 'Terjemahan: Mereka membeli dua tiket konser kemarin.', bank: ['yesterday', 'two', 'They', 'tickets', 'bought', 'concert'], ans: 'They bought two concert tickets yesterday', exp: 'Bentuk lampau (V2) dari "buy" adalah "bought". Pola: S + V2 + O + keterangan waktu.', hint: 'S + V2 (irregular) + O', spoken: 'They bought two concert tickets yesterday.' },

      { id: 'b10', tenseId: 'past_continuous', tenseName: 'Past Continuous Tense', level: 'beginner', type: 'mc', inst: 'Lengkapi kalimat dua kejadian lampau yang saling menyela ini.', prompt: 'I _____ dinner when someone knocked loudly on the door.', options: ['cooked', 'was cooking', 'am cooking', 'were cooking'], ans: 'was cooking', exp: 'Aksi panjang yang sedang berlangsung ketika disela ("when someone knocked") memakai Past Continuous: "was cooking".', hint: 'S + was/were + V-ing + when + S + V2', spoken: 'I was cooking dinner when someone knocked loudly on the door.' },
      { id: 'b11', tenseId: 'past_continuous', tenseName: 'Past Continuous Tense', level: 'beginner', type: 'mc', inst: 'Pilih bentuk tepat untuk jam spesifik di masa lalu.', prompt: 'At 8 PM last night, my parents _____ the evening news on TV.', options: ['was watching', 'were watching', 'watched', 'are watching'], ans: 'were watching', exp: 'Jam spesifik di masa lalu + subjek jamak "my parents" memakai "were watching".', hint: 'S (jamak) + were + V-ing', spoken: 'At 8 PM last night, my parents were watching the evening news on TV.' },
      { id: 'b12', tenseId: 'past_continuous', tenseName: 'Past Continuous Tense', level: 'beginner', type: 'spot', inst: 'Temukan bagian yang salah dalam kalimat berikut.', prompt: 'You was driving too fast when the rain started.', options: ['You', 'was driving', 'too fast', 'started'], ans: 'was driving', exp: 'Subjek "You" selalu memakai "were", tidak pernah "was" → "You were driving".', hint: 'You/We/They + were + V-ing', spoken: 'You were driving too fast when the rain started.' },

      { id: 'b13', tenseId: 'simple_future', tenseName: 'Simple Future Tense', level: 'beginner', type: 'mc', inst: 'Pilih jawaban tepat untuk prediksi yang memiliki bukti visual.', prompt: 'Look at those thick black clouds! It _____ rain very soon.', options: ['is going to', 'will be', 'goes to', 'rained'], ans: 'is going to', exp: 'Prediksi berdasarkan bukti fisik di depan mata ("thick black clouds") memakai "be going to + V1".', hint: 'S + am/is/are + going to + V1', spoken: 'Look at those thick black clouds! It is going to rain very soon.' },
      { id: 'b14', tenseId: 'simple_future', tenseName: 'Simple Future Tense', level: 'beginner', type: 'spot', inst: 'Ketuk bagian yang salah pada kalimat janji masa depan berikut.', prompt: 'I will send you the notes as soon as I will arrive home.', options: ['will send', 'the notes', 'as soon as', 'will arrive'], ans: 'will arrive', exp: 'Di dalam anak kalimat waktu setelah "as soon as / when / before", gunakan Simple Present: "I arrive home".', hint: 'Main clause (will) + as soon as + Simple Present', spoken: 'I will send you the notes as soon as I arrive home.' },
      { id: 'b15', tenseId: 'simple_future', tenseName: 'Simple Future Tense', level: 'beginner', type: 'builder', inst: 'Susun kata berikut menjadi kalimat nominal Simple Future yang benar.', prompt: 'Terjemahan: Presentasinya akan siap besok pagi.', bank: ['ready', 'will', 'tomorrow morning', 'The presentation', 'be'], ans: 'The presentation will be ready tomorrow morning', exp: 'Karena "ready" adalah kata sifat, kalimat Simple Future wajib menyertakan "be" setelah "will".', hint: 'S + will + be + Adjective', spoken: 'The presentation will be ready tomorrow morning.' },

      // INTERMEDIATE (15)
      { id: 'i1', tenseId: 'present_perfect', tenseName: 'Present Perfect Tense', level: 'intermediate', type: 'mc', inst: 'Pilih bentuk kata kerja tepat untuk pengalaman hingga saat ini.', prompt: 'Nadia _____ three international design awards so far.', options: ['won', 'has won', 'is winning', 'have won'], ans: 'has won', exp: '"So far" (sejauh ini) menandakan pencapaian hingga masa sekarang. Subjek tunggal "Nadia" memakai "has won".', hint: 'S (He/She/It) + has + V3', spoken: 'Nadia has won three international design awards so far.' },
      { id: 'i2', tenseId: 'present_perfect', tenseName: 'Present Perfect Tense', level: 'intermediate', type: 'spot', inst: 'Identifikasi bagian yang melanggar aturan Present Perfect vs Simple Past.', prompt: 'We have visited our grandparents in Surabaya last weekend.', options: ['We', 'have visited', 'our grandparents', 'last weekend'], ans: 'have visited', exp: 'Ada keterangan waktu lampau spesifik ("last weekend"), sehingga wajib Simple Past: "We visited".', hint: 'Waktu lampau spesifik → Simple Past (V2)', spoken: 'We visited our grandparents in Surabaya last weekend.' },
      { id: 'i3', tenseId: 'present_perfect', tenseName: 'Present Perfect Tense', level: 'intermediate', type: 'builder', inst: 'Susun kata berikut menjadi kalimat tanya pengalaman hidup yang tepat.', prompt: 'Terjemahan: Pernahkah kamu mencoba menyelam di Raja Ampat?', bank: ['ever', 'diving', 'Have', 'in Raja Ampat', 'tried', 'you'], ans: 'Have you ever tried diving in Raja Ampat', exp: 'Untuk menanyakan pengalaman hidup: Have/Has + S + ever + V3 + O?', hint: 'Have + S + ever + V3?', spoken: 'Have you ever tried diving in Raja Ampat?' },

      { id: 'i4', tenseId: 'present_perfect_continuous', tenseName: 'Present Perfect Continuous', level: 'intermediate', type: 'mc', inst: 'Lengkapi kalimat yang menekankan durasi dari pagi hingga sekarang.', prompt: 'Look at the flooded street! It _____ heavily since early this morning.', options: ['is raining', 'rained', 'has been raining', 'was raining'], ans: 'has been raining', exp: 'Durasi sejak titik lampau hingga kini ("since early this morning") + bukti fisik memakai Present Perfect Continuous.', hint: 'S + has/have + been + V-ing + since ...', spoken: 'Look at the flooded street! It has been raining heavily since early this morning.' },
      { id: 'i5', tenseId: 'present_perfect_continuous', tenseName: 'Present Perfect Continuous', level: 'intermediate', type: 'spot', inst: 'Temukan kesalahan penggunaan tense pada kalimat durasi berikut.', prompt: 'I am learning English grammar at this institute for two years.', options: ['I', 'am learning', 'at this institute', 'for two years'], ans: 'am learning', exp: 'Present Continuous tidak boleh dipasangkan dengan durasi "for two years". Seharusnya: "have been learning".', hint: 'Durasi "for ..." hingga kini → have/has been + V-ing', spoken: 'I have been learning English grammar at this institute for two years.' },
      { id: 'i6', tenseId: 'present_perfect_continuous', tenseName: 'Present Perfect Continuous', level: 'intermediate', type: 'builder', inst: 'Susun pertanyaan mengenai lamanya durasi aktivitas.', prompt: 'Terjemahan: Sudah berapa lama mereka bekerja di proyek ini?', bank: ['working', 'been', 'How long', 'on this project', 'they', 'have'], ans: 'How long have they been working on this project', exp: 'Pola pertanyaan durasi Present Perfect Continuous: How long + have/has + S + been + V-ing?', hint: 'How long + have + S + been + V-ing?', spoken: 'How long have they been working on this project?' },

      { id: 'i7', tenseId: 'past_perfect', tenseName: 'Past Perfect Tense', level: 'intermediate', type: 'mc', inst: 'Pilih bentuk kata kerja untuk kejadian yang lebih dulu selesai di masa lalu.', prompt: 'By the time we reached the airport, the plane _____.', options: ['already took off', 'had already taken off', 'has already taken off', 'was taking off'], ans: 'had already taken off', exp: 'Pesawat lepas landas LEBIH DULU sebelum kami tiba ("reached" = V2) → Past Perfect: "had already taken off".', hint: 'By the time + S + V2, S + had + V3', spoken: 'By the time we reached the airport, the plane had already taken off.' },
      { id: 'i8', tenseId: 'past_perfect', tenseName: 'Past Perfect Tense', level: 'intermediate', type: 'spot', inst: 'Temukan kesalahan bentuk kata kerja dalam kalimat Past Perfect berikut.', prompt: 'She realized that she had forgot her passport at home.', options: ['realized', 'that', 'had forgot', 'at home'], ans: 'had forgot', exp: 'Setelah "had", wajib V3 (Past Participle). V3 dari "forget" adalah "forgotten" → "had forgotten".', hint: 'S + had + V3 (forget → forgot → forgotten)', spoken: 'She realized that she had forgotten her passport at home.' },
      { id: 'i9', tenseId: 'past_perfect', tenseName: 'Past Perfect Tense', level: 'intermediate', type: 'builder', inst: 'Susun kalimat urutan dua peristiwa di masa lalu berikut.', prompt: 'Terjemahan: Dia belum pernah melihat salju sebelum tahun 2022.', bank: ['seen', 'before 2022', 'He', 'never', 'snow', 'had'], ans: 'He had never seen snow before 2022', exp: 'Pengalaman hingga titik tertentu di masa lalu ("before 2022") memakai Past Perfect: S + had + never + V3.', hint: 'S + had + never + V3 + before ...', spoken: 'He had never seen snow before 2022.' },

      { id: 'i10', tenseId: 'future_continuous', tenseName: 'Future Continuous Tense', level: 'intermediate', type: 'mc', inst: 'Lengkapi kalimat untuk aktivitas yang akan sedang terjadi pada jam spesifik besok.', prompt: "Don't call me at 10 AM tomorrow because I _____ an important exam.", options: ['will take', 'will be taking', 'am taking', 'will have taken'], ans: 'will be taking', exp: 'Titik jam spesifik ("at 10 AM") + masa depan ("tomorrow") → Future Continuous: "will be taking".', hint: 'S + will + be + V-ing (at 10 AM tomorrow)', spoken: "Don't call me at 10 AM tomorrow because I will be taking an important exam." },
      { id: 'i11', tenseId: 'future_continuous', tenseName: 'Future Continuous Tense', level: 'intermediate', type: 'spot', inst: 'Ketuk bagian yang salah pada kalimat tanya sopan berikut.', prompt: 'Will be you using your tablet during the flight tonight?', options: ['Will be you', 'using', 'your tablet', 'tonight'], ans: 'Will be you', exp: 'Dalam kalimat tanya Future Continuous, subjek diletakkan di antara "Will" dan "be" → "Will you be".', hint: 'Will + S + be + V-ing?', spoken: 'Will you be using your tablet during the flight tonight?' },
      { id: 'i12', tenseId: 'future_continuous', tenseName: 'Future Continuous Tense', level: 'intermediate', type: 'builder', inst: 'Susun kata berikut menjadi kalimat Future Continuous yang benar.', prompt: 'Terjemahan: Jam segini besok kami akan sedang terbang ke Tokyo.', bank: ['will', 'flying', 'This time tomorrow', 'be', 'to Tokyo', 'we'], ans: 'This time tomorrow we will be flying to Tokyo', exp: 'Frasa "This time tomorrow" sangat khas untuk Future Continuous: S + will + be + V-ing.', hint: 'This time tomorrow + S + will + be + V-ing', spoken: 'This time tomorrow we will be flying to Tokyo.' },

      { id: 'i13', tenseId: 'simple_past_future', tenseName: 'Simple Past Future Tense', level: 'intermediate', type: 'mc', inst: 'Lengkapi kalimat pengandaian (Conditional Sentence Tipe 2) berikut.', prompt: 'If I spoke fluent Japanese, I _____ for that scholarship in Kyoto.', options: ['will apply', 'would apply', 'applied', 'would applied'], ans: 'would apply', exp: 'Klausa "If" memakai Simple Past ("spoke") → Conditional Tipe 2. Induk kalimat memakai "would + V1" (would apply).', hint: 'If + S + V2, S + would + V1', spoken: 'If I spoke fluent Japanese, I would apply for that scholarship in Kyoto.' },
      { id: 'i14', tenseId: 'simple_past_future', tenseName: 'Simple Past Future Tense', level: 'intermediate', type: 'spot', inst: 'Temukan kesalahan pada kalimat tidak langsung (Reported Speech) ini.', prompt: 'Dimas promised me that he will finish the prototype by Friday.', options: ['promised', 'that', 'will finish', 'by Friday'], ans: 'will finish', exp: 'Kata kerja pelapor lampau ("promised") menggeser "will" menjadi "would" → "would finish".', hint: 'S + V2 (said/promised) + that + S + would + V1', spoken: 'Dimas promised me that he would finish the prototype by Friday.' },
      { id: 'i15', tenseId: 'simple_past_future', tenseName: 'Simple Past Future Tense', level: 'intermediate', type: 'builder', inst: 'Susun kata berikut menjadi kalimat rencana lampau yang batal.', prompt: 'Terjemahan: Aku tadinya akan meneleponmu tetapi bateraiku habis.', bank: ['going to', 'but', 'call you', 'I', 'my battery died', 'was'], ans: 'I was going to call you but my battery died', exp: 'Untuk menyatakan niat di masa lalu yang batal, gunakan: S + was/were + going to + V1.', hint: 'S + was/were + going to + V1', spoken: 'I was going to call you but my battery died.' },

      // ADVANCED (18)
      { id: 'a1', tenseId: 'past_perfect_continuous', tenseName: 'Past Perfect Continuous', level: 'advanced', type: 'mc', inst: 'Pilih tense yang tepat untuk durasi sebelum kejadian lampau lainnya.', prompt: 'They _____ for nearly three hours before the rescue team finally arrived.', options: ['were hiking', 'had been hiking', 'have been hiking', 'had hiked'], ans: 'had been hiking', exp: 'Durasi berkelanjutan ("for nearly three hours") SEBELUM titik lampau kedua ("arrived") → "had been hiking".', hint: 'S + had + been + V-ing + for ... before + V2', spoken: 'They had been hiking for nearly three hours before the rescue team finally arrived.' },
      { id: 'a2', tenseId: 'past_perfect_continuous', tenseName: 'Past Perfect Continuous', level: 'advanced', type: 'spot', inst: 'Identifikasi kesalahan gramatikal pada kalimat sebab-akibat lampau berikut.', prompt: 'Her eyes were tired because she was staring at the monitor all night.', options: ['were tired', 'because', 'was staring', 'all night'], ans: 'was staring', exp: 'Aktivitas terus-menerus ("all night") yang menyebabkan kondisi lampau ("were tired") memakai Past Perfect Continuous: "had been staring".', hint: 'Kondisi lampau + because + S + had been + V-ing', spoken: 'Her eyes were tired because she had been staring at the monitor all night.' },
      { id: 'a3', tenseId: 'past_perfect_continuous', tenseName: 'Past Perfect Continuous', level: 'advanced', type: 'builder', inst: 'Susun pertanyaan tentang durasi sebelum peristiwa di masa lalu.', prompt: 'Terjemahan: Sudah berapa lama dia menunggu sebelum bus datang?', bank: ['been waiting', 'before', 'had', 'How long', 'she', 'the bus came'], ans: 'How long had she been waiting before the bus came', exp: 'Pola tanya Past Perfect Continuous: How long + had + S + been + V-ing + before + Simple Past?', hint: 'How long + had + S + been + V-ing?', spoken: 'How long had she been waiting before the bus came?' },

      { id: 'a4', tenseId: 'future_perfect', tenseName: 'Future Perfect Tense', level: 'advanced', type: 'mc', inst: 'Pilih bentuk kata kerja tepat untuk target yang selesai sebelum tenggat waktu.', prompt: 'By the end of this year, the architect _____ the new cultural center.', options: ['will complete', 'will have completed', 'will be completing', 'has completed'], ans: 'will have completed', exp: '"By the end of this year" menandakan pekerjaan akan SUDAH selesai menjelang titik tersebut → "will have completed".', hint: 'By + waktu masa depan, S + will + have + V3', spoken: 'By the end of this year, the architect will have completed the new cultural center.' },
      { id: 'a5', tenseId: 'future_perfect', tenseName: 'Future Perfect Tense', level: 'advanced', type: 'spot', inst: 'Temukan kesalahan struktur auxiliary pada kalimat Future Perfect ini.', prompt: 'By next Monday, Elena will has submitted all her final reports.', options: ['By next Monday', 'will has', 'submitted', 'final reports'], ans: 'will has', exp: 'Setelah modal "will", auxiliary selalu bentuk dasar "have" untuk semua subjek → "will have".', hint: 'S (semua subjek) + will + have + V3', spoken: 'By next Monday, Elena will have submitted all her final reports.' },
      { id: 'a6', tenseId: 'future_perfect', tenseName: 'Future Perfect Tense', level: 'advanced', type: 'builder', inst: 'Susun kata berikut menjadi kalimat Future Perfect yang benar.', prompt: 'Terjemahan: Menjelang jam 9 malam, kami akan sudah menyelesaikan tugas ini.', bank: ['will', 'this task', 'By 9 PM', 'have', 'finished', 'we'], ans: 'By 9 PM we will have finished this task', exp: 'Struktur Future Perfect: By + batas waktu + S + will + have + V3.', hint: 'By ... + S + will + have + V3', spoken: 'By 9 PM we will have finished this task.' },

      { id: 'a7', tenseId: 'future_perfect_continuous', tenseName: 'Future Perfect Continuous', level: 'advanced', type: 'mc', inst: 'Pilih bentuk tense untuk total durasi aktivitas hingga titik masa depan.', prompt: 'By next July, Dr. Arman _____ at this hospital for twenty years.', options: ['will work', 'will be working', 'will have been working', 'has been working'], ans: 'will have been working', exp: 'Dua sinyal kuat: patokan masa depan ("By next July") + durasi ("for twenty years") → "will have been working".', hint: 'By + masa depan + S + will + have + been + V-ing + for ...', spoken: 'By next July, Dr. Arman will have been working at this hospital for twenty years.' },
      { id: 'a8', tenseId: 'future_perfect_continuous', tenseName: 'Future Perfect Continuous', level: 'advanced', type: 'spot', inst: 'Temukan kata kerja statis yang keliru dipakai dalam bentuk continuous.', prompt: 'By 2028, we will have been knowing each other for fifteen years.', options: ['By 2028', 'will have been knowing', 'each other', 'for fifteen years'], ans: 'will have been knowing', exp: '"Know" adalah stative verb. Gunakan Future Perfect biasa: "will have known".', hint: 'Stative verb + by ... for ... → will have + V3', spoken: 'By 2028, we will have known each other for fifteen years.' },
      { id: 'a9', tenseId: 'future_perfect_continuous', tenseName: 'Future Perfect Continuous', level: 'advanced', type: 'builder', inst: 'Susun rangkaian Future Perfect Continuous yang tepat.', prompt: 'Terjemahan: Menjelang siang dia akan sudah belajar selama empat jam.', bank: ['have been', 'for four hours', 'By noon', 'will', 'studying', 'she'], ans: 'By noon she will have been studying for four hours', exp: 'Urutan wajib Future Perfect Continuous: S + will + have + been + V-ing.', hint: 'S + will + have + been + V-ing', spoken: 'By noon she will have been studying for four hours.' },

      { id: 'a10', tenseId: 'past_future_continuous', tenseName: 'Past Future Continuous', level: 'advanced', type: 'mc', inst: 'Pilih jawaban tepat untuk Reported Speech dari Future Continuous.', prompt: 'Bintang told us that he _____ a workshop in Bandung at 2 PM the next day.', options: ['will be leading', 'would be leading', 'would lead', 'was led'], ans: 'would be leading', exp: 'Kata kerja pelapor lampau ("told") mengubah Future Continuous menjadi Past Future Continuous ("would be leading").', hint: 'S + told/said + that + S + would + be + V-ing', spoken: 'Bintang told us that he would be leading a workshop in Bandung at 2 PM the next day.' },
      { id: 'a11', tenseId: 'past_future_continuous', tenseName: 'Past Future Continuous', level: 'advanced', type: 'mc', inst: 'Lengkapi pengandaian aktivitas yang seharusnya sedang terjadi sekarang.', prompt: "If we hadn't missed the ferry, we _____ sunset on the island right now.", options: ['would watch', 'would be watching', 'will be watching', 'had watched'], ans: 'would be watching', exp: 'Mixed Conditional yang membayangkan aktivitas sedang berlangsung "right now" memakai "would be watching".', hint: 'If + Past Perfect, S + would + be + V-ing (right now)', spoken: "If we hadn't missed the ferry, we would be watching sunset on the island right now." },
      { id: 'a12', tenseId: 'past_future_continuous', tenseName: 'Past Future Continuous', level: 'advanced', type: 'spot', inst: 'Ketuk bagian kalimat yang kurang lengkap strukturnya.', prompt: 'She mentioned that she would working remotely throughout November.', options: ['mentioned', 'would working', 'remotely', 'throughout November'], ans: 'would working', exp: 'Struktur Past Future Continuous membutuhkan "be" sebelum V-ing → "would be working".', hint: 'S + would + be + V-ing', spoken: 'She mentioned that she would be working remotely throughout November.' },

      { id: 'a13', tenseId: 'past_future_perfect', tenseName: 'Past Future Perfect Tense', level: 'advanced', type: 'mc', inst: 'Lengkapi Conditional Sentence Tipe 3 tentang penyesalan masa lalu ini.', prompt: 'If you had checked the schedule carefully, you _____ the train.', options: ['would not miss', 'would not have missed', 'will not have missed', 'did not miss'], ans: 'would not have missed', exp: 'Klausa "If" memakai Past Perfect ("had checked") → Conditional Tipe 3. Induk kalimat wajib "would not have missed".', hint: 'If + S + had + V3, S + would + (not) + have + V3', spoken: 'If you had checked the schedule carefully, you would not have missed the train.' },
      { id: 'a14', tenseId: 'past_future_perfect', tenseName: 'Past Future Perfect Tense', level: 'advanced', type: 'spot', inst: 'Temukan kesalahan umum pada kalimat pengandaian Tipe 3 berikut.', prompt: 'If I would have known about the delay, I would have stayed at home.', options: ['If I', 'would have known', 'about the delay', 'would have stayed'], ans: 'would have known', exp: 'Jangan pernah menaruh "would have" di dalam klausa "If"! Seharusnya Past Perfect: "If I had known".', hint: 'Klausa If: had + V3 | Induk kalimat: would have + V3', spoken: 'If I had known about the delay, I would have stayed at home.' },
      { id: 'a15', tenseId: 'past_future_perfect', tenseName: 'Past Future Perfect Tense', level: 'advanced', type: 'builder', inst: 'Susun kalimat Past Future Perfect yang benar.', prompt: 'Terjemahan: Dia pasti sudah memenangkan lomba itu dengan persiapan lebih.', bank: ['won', 'would', 'with more preparation', 'She', 'the contest', 'have'], ans: 'She would have won the contest with more preparation', exp: 'Struktur Past Future Perfect: S + would + have + V3 (win → won).', hint: 'S + would + have + V3', spoken: 'She would have won the contest with more preparation.' },

      { id: 'a16', tenseId: 'past_future_perfect_continuous', tenseName: 'Past Future Perfect Continuous', level: 'advanced', type: 'mc', inst: 'Pilih rangkaian paling tepat untuk durasi hipotetis di masa lampau.', prompt: "If he hadn't moved abroad, he _____ at this studio for ten years by last May.", options: ['would work', 'would have worked', 'would have been working', 'will have been working'], ans: 'would have been working', exp: 'Pengandaian masa lalu + durasi ("for ten years") + patokan lampau ("by last May") → "would have been working".', hint: 'S + would + have + been + V-ing', spoken: "If he hadn't moved abroad, he would have been working at this studio for ten years by last May." },
      { id: 'a17', tenseId: 'past_future_perfect_continuous', tenseName: 'Past Future Perfect Continuous', level: 'advanced', type: 'spot', inst: 'Temukan kata yang salah pada rangkaian auxiliary berikut.', prompt: 'By last week, they would have being practicing the dance for two months.', options: ['By last week', 'would have being', 'practicing', 'for two months'], ans: 'would have being', exp: 'Setelah "have", bentuk V3 dari "be" adalah "been", bukan "being" → "would have been".', hint: 'would + have + been (V3) + V-ing', spoken: 'By last week, they would have been practicing the dance for two months.' },
      { id: 'a18', tenseId: 'past_future_perfect_continuous', tenseName: 'Past Future Perfect Continuous', level: 'advanced', type: 'builder', inst: 'Susun struktur lengkap Past Future Perfect Continuous berikut.', prompt: 'Terjemahan: Kami akan sudah belajar selama tiga jam saat itu.', bank: ['been', 'studying', 'by then', 'We', 'for three hours', 'would have'], ans: 'We would have been studying for three hours by then', exp: 'Urutan 4 komponen utama: would + have + been + V-ing + durasi + patokan waktu.', hint: 'S + would + have + been + V-ing', spoken: 'We would have been studying for three hours by then.' }
    ];

    // =========================================================================
    // 2. STATE & LOCALSTORAGE PERSISTENCE
    // =========================================================================
    const STORAGE_KEY = 'tensemaster_pwa_state_v1';

    function loadProgress() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) return JSON.parse(raw);
      } catch (e) {}
      return {
        completed: [],
        bookmarks: [],
        lastTenseId: 'simple_present',
        bestScores: { beginner: 0, intermediate: 0, advanced: 0, mixed: 0 },
        totalQuizzes: 0,
        theme: window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
      };
    }

    const appState = {
      route: 'home', // 'home' | 'learn' | 'practice' | 'reference' | 'detail' | 'quiz'
      prevRoute: 'home',
      detailTenseId: 'simple_present',
      detailTab: 0,
      refTab: 0,
      search: '',
      catFilter: null,
      levelFilter: null,
      progress: loadProgress(),
      quiz: null
    };

    function saveProgress() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(appState.progress));
      } catch (e) {}
    }

    // =========================================================================
    // 3. UTILITIES (SAFE HTML ESCAPING, SPEECH SYNTHESIS, SVG TIMELINES)
    // =========================================================================
    function esc(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function speakText(text) {
      if (!('speechSynthesis' in window) || !text) return;
      try {
        window.speechSynthesis.cancel();
        const utter = new SpeechSynthesisUtterance(text);
        utter.lang = 'en-US';
        utter.rate = 0.92;
        window.speechSynthesis.speak(utter);
      } catch (e) {}
    }

    function catColorVar(cat) {
      return cat === 'present' ? 'var(--present)' :
             cat === 'past' ? 'var(--past)' :
             cat === 'future' ? 'var(--future)' : 'var(--past-future)';
    }

    function catBgVar(cat) {
      return cat === 'present' ? 'var(--present-bg)' :
             cat === 'past' ? 'var(--past-bg)' :
             cat === 'future' ? 'var(--future-bg)' : 'var(--past-future-bg)';
    }

    function levelMeta(levelId) {
      return LEVELS.find(l => l.id === levelId) || LEVELS[0];
    }

    function shuffle(arr) {
      const copy = [...arr];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    function buildWavePath(x1, x2, cy, amp) {
      let d = '';
      const steps = 32;
      for (let i = 0; i <= steps; i++) {
        const t = i / steps;
        const x = x1 + (x2 - x1) * t;
        const y = cy + Math.sin(t * 4 * Math.PI) * amp;
        d += (i === 0 ? 'M' : 'L') + x.toFixed(1) + ' ' + y.toFixed(1) + ' ';
      }
      return d;
    }

    function renderTimelineSVG(tenseId, cat) {
      const accent = catColorVar(cat);
      const bg = catBgVar(cat);
      const cy = 46;
      let shapes = '';
      switch (tenseId) {
        case 'simple_present':
          [66, 114, 160, 206, 254].forEach(x => {
            shapes += `<circle cx="${x}" cy="${cy}" r="10" fill="${bg}"/><circle cx="${x}" cy="${cy}" r="5.5" fill="${accent}"/>`;
          });
          break;
        case 'present_continuous':
          shapes += `<path d="${buildWavePath(118, 202, cy, 10)}" fill="none" stroke="${accent}" stroke-width="3.5" stroke-linecap="round"/>`;
          shapes += `<circle cx="160" cy="${cy}" r="6.5" fill="${accent}"/>`;
          break;
        case 'present_perfect':
          shapes += `<path d="M 88 ${cy} Q 124 12 160 ${cy}" fill="none" stroke="${accent}" stroke-width="3.2" stroke-linecap="round"/>`;
          shapes += `<circle cx="88" cy="${cy}" r="9" fill="${bg}"/><circle cx="88" cy="${cy}" r="5.5" fill="${accent}"/>`;
          shapes += `<circle cx="160" cy="${cy}" r="7" fill="${accent}"/>`;
          break;
        case 'present_perfect_continuous':
          shapes += `<path d="${buildWavePath(84, 160, cy, 9.5)}" fill="none" stroke="${accent}" stroke-width="3.5" stroke-linecap="round"/>`;
          shapes += `<circle cx="84" cy="${cy}" r="6" fill="${accent}"/><circle cx="160" cy="${cy}" r="7.5" fill="${accent}"/>`;
          break;
        case 'simple_past':
          shapes += `<circle cx="90" cy="${cy}" r="12" fill="${bg}"/><circle cx="90" cy="${cy}" r="6.5" fill="${accent}"/>`;
          break;
        case 'past_continuous':
          shapes += `<path d="${buildWavePath(54, 126, cy, 10)}" fill="none" stroke="${accent}" stroke-width="3.5" stroke-linecap="round"/>`;
          shapes += `<line x1="90" y1="${cy - 18}" x2="90" y2="${cy + 18}" stroke="var(--primary)" stroke-width="3" stroke-linecap="round"/>`;
          shapes += `<circle cx="90" cy="${cy}" r="5" fill="var(--primary)"/>`;
          break;
        case 'past_perfect':
          shapes += `<path d="M 56 ${cy} Q 90 12 124 ${cy}" fill="none" stroke="${accent}" stroke-width="3.2" stroke-linecap="round"/>`;
          shapes += `<circle cx="56" cy="${cy}" r="6.5" fill="${accent}"/><circle cx="124" cy="${cy}" r="5.5" fill="var(--muted)"/>`;
          break;
        case 'past_perfect_continuous':
          shapes += `<path d="${buildWavePath(54, 124, cy, 9.5)}" fill="none" stroke="${accent}" stroke-width="3.5" stroke-linecap="round"/>`;
          shapes += `<circle cx="54" cy="${cy}" r="5.5" fill="${accent}"/><circle cx="124" cy="${cy}" r="6.5" fill="var(--primary)"/>`;
          break;
        case 'simple_future':
          shapes += `<circle cx="230" cy="${cy}" r="12" fill="${bg}"/><circle cx="230" cy="${cy}" r="6.5" fill="${accent}"/>`;
          break;
        case 'future_continuous':
          shapes += `<path d="${buildWavePath(194, 268, cy, 10)}" fill="none" stroke="${accent}" stroke-width="3.5" stroke-linecap="round"/>`;
          shapes += `<circle cx="231" cy="${cy}" r="6" fill="${accent}"/>`;
          break;
        case 'future_perfect':
          shapes += `<path d="M 192 ${cy} Q 229 12 266 ${cy}" fill="none" stroke="${accent}" stroke-width="3.2" stroke-linecap="round"/>`;
          shapes += `<circle cx="192" cy="${cy}" r="6" fill="${accent}"/><line x1="266" y1="${cy - 17}" x2="266" y2="${cy + 17}" stroke="${accent}" stroke-width="3.2" stroke-linecap="round"/>`;
          break;
        case 'future_perfect_continuous':
          shapes += `<path d="${buildWavePath(140, 266, cy, 9.5)}" fill="none" stroke="${accent}" stroke-width="3.5" stroke-linecap="round"/>`;
          shapes += `<line x1="266" y1="${cy - 17}" x2="266" y2="${cy + 17}" stroke="${accent}" stroke-width="3.2" stroke-linecap="round"/>`;
          break;
        case 'simple_past_future':
          shapes += `<path d="M 58 ${cy} Q 96 12 134 ${cy}" fill="none" stroke="${accent}" stroke-width="3" stroke-dasharray="6 5" stroke-linecap="round"/>`;
          shapes += `<circle cx="58" cy="${cy}" r="6" fill="${accent}"/><circle cx="134" cy="${cy}" r="7" fill="none" stroke="${accent}" stroke-width="2.5"/>`;
          break;
        case 'past_future_continuous':
          shapes += `<path d="M 54 ${cy} Q 86 14 118 ${cy}" fill="none" stroke="${accent}" stroke-width="3" stroke-dasharray="6 5"/>`;
          shapes += `<path d="${buildWavePath(106, 148, cy, 9)}" fill="none" stroke="${accent}" stroke-width="3" opacity="0.8"/>`;
          shapes += `<circle cx="54" cy="${cy}" r="5.5" fill="${accent}"/>`;
          break;
        case 'past_future_perfect':
          shapes += `<path d="M 56 ${cy} Q 92 10 128 ${cy}" fill="none" stroke="${accent}" stroke-width="3.2" stroke-dasharray="6 5"/>`;
          shapes += `<circle cx="56" cy="${cy}" r="6" fill="${accent}"/><circle cx="128" cy="${cy}" r="7.5" fill="none" stroke="${accent}" stroke-width="2.8"/>`;
          break;
        default:
          shapes += `<path d="${buildWavePath(56, 128, cy, 9)}" fill="none" stroke="${accent}" stroke-width="3" opacity="0.75"/>`;
          shapes += `<path d="M 56 ${cy} Q 92 10 128 ${cy}" fill="none" stroke="${accent}" stroke-width="3" stroke-dasharray="6 5"/>`;
          shapes += `<circle cx="56" cy="${cy}" r="5.5" fill="${accent}"/><circle cx="128" cy="${cy}" r="7" fill="none" stroke="${accent}" stroke-width="2.6"/>`;
          break;
      }

      return `
        <svg viewBox="0 0 320 76" width="100%" height="76" role="img" aria-label="Diagram garis waktu">
          <line x1="18" y1="${cy}" x2="302" y2="${cy}" stroke="var(--outline)" stroke-width="2.5" stroke-linecap="round"/>
          <polyline points="294,${cy - 6} 302,${cy} 294,${cy + 6}" fill="none" stroke="var(--outline)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
          <line x1="160" y1="8" x2="160" y2="68" stroke="var(--primary)" stroke-width="2" stroke-dasharray="5 4" opacity="0.55"/>
          ${shapes}
        </svg>
      `;
    }

    function highlightSentenceHTML(sentence, highlight, cat) {
      const idx = sentence.toLowerCase().indexOf(highlight.toLowerCase());
      if (idx < 0) return esc(sentence);
      const before = esc(sentence.slice(0, idx));
      const match = esc(sentence.slice(idx, idx + highlight.length));
      const after = esc(sentence.slice(idx + highlight.length));
      return `${before}<span class="highlight-verb" style="color:${catColorVar(cat)};background:${catBgVar(cat)}">${match}</span>${after}`;
    }

    // =========================================================================
    // 4. NAVIGATION & ACTIONS
    // =========================================================================
    function applyTheme() {
      const dark = appState.progress.theme === 'dark';
      document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
      document.getElementById('themeToggleBtn').textContent = dark ? '☀️' : '🌙';
      document.getElementById('railThemeBtn').textContent = dark ? '☀️ Mode Terang' : '🌙 Mode Gelap';
    }

    function toggleTheme() {
      appState.progress.theme = appState.progress.theme === 'dark' ? 'light' : 'dark';
      saveProgress();
      applyTheme();
    }

    function navigateTab(route) {
      if ('speechSynthesis' in window) window.speechSynthesis.cancel();
      appState.route = route;
      appState.prevRoute = route;
      window.scrollTo({ top: 0, behavior: 'instant' });
      render();
    }

    function openTense(tenseId) {
      if ('speechSynthesis' in window) window.speechSynthesis.cancel();
      if (appState.route !== 'detail') appState.prevRoute = appState.route;
      appState.detailTenseId = tenseId;
      appState.detailTab = 0;
      appState.progress.lastTenseId = tenseId;
      saveProgress();
      appState.route = 'detail';
      window.scrollTo({ top: 0, behavior: 'instant' });
      render();
    }

    function goBack() {
      if ('speechSynthesis' in window) window.speechSynthesis.cancel();
      appState.route = appState.prevRoute || 'home';
      window.scrollTo({ top: 0, behavior: 'instant' });
      render();
    }

    function exploreCategory(cat) {
      appState.catFilter = cat;
      appState.levelFilter = null;
      appState.search = '';
      navigateTab('learn');
    }

    function exploreLevel(lvl) {
      appState.levelFilter = lvl;
      appState.catFilter = null;
      appState.search = '';
      navigateTab('learn');
    }

    function toggleBookmark(tenseId, evt) {
      if (evt) evt.stopPropagation();
      const idx = appState.progress.bookmarks.indexOf(tenseId);
      if (idx >= 0) appState.progress.bookmarks.splice(idx, 1);
      else appState.progress.bookmarks.push(tenseId);
      saveProgress();
      render();
    }

    function toggleCompleted(tenseId) {
      const idx = appState.progress.completed.indexOf(tenseId);
      if (idx >= 0) appState.progress.completed.splice(idx, 1);
      else appState.progress.completed.push(tenseId);
      saveProgress();
      render();
    }

    // Quiz Engine Actions
    function startQuiz(sessionKey, title, questions) {
      if ('speechSynthesis' in window) window.speechSynthesis.cancel();
      if (appState.route !== 'quiz') appState.prevRoute = appState.route;
      appState.quiz = {
        key: sessionKey,
        title: title,
        questions: shuffle(questions),
        index: 0,
        selected: null,
        assembled: [],
        checked: false,
        isCorrect: false,
        correctCount: 0,
        streak: 0,
        bestStreak: 0,
        records: [],
        finished: false
      };
      appState.route = 'quiz';
      window.scrollTo({ top: 0, behavior: 'instant' });
      render();
    }

    function startLevelQuiz(levelId) {
      const meta = levelMeta(levelId);
      const qs = QUESTIONS.filter(q => q.level === levelId);
      startQuiz(levelId, `Latihan Tingkat ${meta.label} (${meta.cefr})`, qs);
    }

    function startMixedQuiz() {
      const b = shuffle(QUESTIONS.filter(q => q.level === 'beginner')).slice(0, 4);
      const i = shuffle(QUESTIONS.filter(q => q.level === 'intermediate')).slice(0, 4);
      const a = shuffle(QUESTIONS.filter(q => q.level === 'advanced')).slice(0, 4);
      startQuiz('mixed', 'Tantangan Campuran 16 Tenses', [...b, ...i, ...a]);
    }

    function startTenseDrill(tenseId) {
      const tense = TENSES.find(t => t.id === tenseId);
      const qs = QUESTIONS.filter(q => q.tenseId === tenseId);
      startQuiz(`tense_${tenseId}`, `Latihan: ${tense ? tense.name : tenseId}`, qs);
    }

    function selectQuizOption(optIdx) {
      const q = appState.quiz;
      if (!q || q.checked) return;
      const cur = q.questions[q.index];
      q.selected = cur.options[optIdx];
      render();
    }

    function addBuilderWord(wordIdx) {
      const q = appState.quiz;
      if (!q || q.checked) return;
      const cur = q.questions[q.index];
      const remaining = [...cur.bank];
      q.assembled.forEach(w => {
        const i = remaining.indexOf(w);
        if (i >= 0) remaining.splice(i, 1);
      });
      if (remaining[wordIdx] !== undefined) {
        q.assembled.push(remaining[wordIdx]);
        render();
      }
    }

    function removeBuilderWord(idx) {
      const q = appState.quiz;
      if (!q || q.checked) return;
      q.assembled.splice(idx, 1);
      render();
    }

    function clearBuilderWords() {
      const q = appState.quiz;
      if (!q || q.checked) return;
      q.assembled = [];
      render();
    }

    function checkQuizAnswer() {
      const q = appState.quiz;
      if (!q || q.checked) return;
      const cur = q.questions[q.index];
      const userAns = cur.type === 'builder' ? q.assembled.join(' ').trim() : (q.selected || '').trim();
      if (!userAns) return;
      const ok = userAns.toLowerCase() === cur.ans.trim().toLowerCase();
      q.checked = true;
      q.isCorrect = ok;
      if (ok) {
        q.correctCount++;
        q.streak++;
        q.bestStreak = Math.max(q.bestStreak, q.streak);
      } else {
        q.streak = 0;
      }
      q.records.push({ question: cur, userAns, ok });
      render();
    }

    function nextQuizQuestion() {
      const q = appState.quiz;
      if (!q || !q.checked) return;
      if (q.index + 1 >= q.questions.length) {
        q.finished = true;
        const pct = Math.round((q.correctCount / q.questions.length) * 100);
        appState.progress.totalQuizzes = (appState.progress.totalQuizzes || 0) + 1;
        if (q.key in appState.progress.bestScores) {
          appState.progress.bestScores[q.key] = Math.max(appState.progress.bestScores[q.key], pct);
        }
        saveProgress();
      } else {
        q.index++;
        q.selected = null;
        q.assembled = [];
        q.checked = false;
        q.isCorrect = false;
      }
      window.scrollTo({ top: 0, behavior: 'smooth' });
      render();
    }

    function restartQuiz() {
      if (!appState.quiz) return;
      startQuiz(appState.quiz.key, appState.quiz.title, appState.quiz.questions);
    }

    // =========================================================================
    // 5. RENDERERS
    // =========================================================================
    function renderTenseCard(t) {
      const isDone = appState.progress.completed.includes(t.id);
      const isSaved = appState.progress.bookmarks.includes(t.id);
      const lvl = levelMeta(t.level);
      const cat = TIME_CATEGORIES.find(c => c.id === t.category);
      return `
        <article class="tense-card" onclick="openTense('${t.id}')">
          <div class="row-between" style="align-items:flex-start;">
            <div class="row" style="flex:1;min-width:0;">
              <div class="num-pill" style="background:${catBgVar(t.category)};color:${catColorVar(t.category)}">${String(t.number).padStart(2, '0')}</div>
              <div style="min-width:0;">
                <div style="font-weight:700;font-size:1rem;">${esc(t.name)}</div>
                <div style="font-size:0.78rem;color:var(--muted);">${esc(t.idTitle)}</div>
              </div>
            </div>
            <div class="row" style="gap:4px;">
              ${isDone ? '<span title="Sudah dipahami" style="font-size:1.1rem;">✅</span>' : ''}
              <button class="icon-btn" style="width:36px;height:36px;border-radius:10px;" onclick="toggleBookmark('${t.id}', event)" aria-label="Simpan favorit">
                ${isSaved ? '⭐' : '☆'}
              </button>
            </div>
          </div>
          <p style="margin:10px 0 12px;font-size:0.86rem;color:var(--muted);">${esc(t.summary)}</p>
          <div class="formula-box" style="color:${catColorVar(t.category)};margin-bottom:12px;">${esc(t.formula.vp)}</div>
          <div class="row" style="flex-wrap:wrap;gap:6px;">
            <span class="badge badge-${t.category}">${esc(cat.label)}</span>
            <span class="badge badge-${t.level}">${esc(lvl.label)} · ${esc(lvl.cefr)}</span>
            <span class="badge badge-neutral">${esc(t.aspect)}</span>
          </div>
        </article>
      `;
    }

    function renderHome() {
      const done = appState.progress.completed.length;
      const pct = Math.round((done / TENSES.length) * 100);
      const last = TENSES.find(t => t.id === appState.progress.lastTenseId) || TENSES[0];

      const bentoHTML = TIME_CATEGORIES.map(c => {
        const cDone = TENSES.filter(t => t.category === c.id && appState.progress.completed.includes(t.id)).length;
        return `
          <button class="bento-card" onclick="exploreCategory('${c.id}')">
            <div class="row-between" style="margin-bottom:10px;">
              <span class="num-pill" style="width:36px;height:36px;background:${catBgVar(c.id)};">${c.icon}</span>
              <span style="font-size:0.8rem;font-weight:800;color:${catColorVar(c.id)}">${cDone}/4</span>
            </div>
            <div style="font-weight:800;font-size:0.98rem;">${esc(c.label)}</div>
            <div style="font-size:0.76rem;color:var(--muted);">${esc(c.sub)}</div>
          </button>
        `;
      }).join('');

      const levelsHTML = LEVELS.map(lvl => {
        const list = TENSES.filter(t => t.level === lvl.id);
        const lDone = list.filter(t => appState.progress.completed.includes(t.id)).length;
        const best = appState.progress.bestScores[lvl.id] || 0;
        const colorVar = `var(--${lvl.id})`;
        return `
          <div class="card">
            <div class="row-between" style="margin-bottom:8px;flex-wrap:wrap;">
              <div class="row">
                <strong style="font-size:1rem;">Tingkat ${esc(lvl.label)}</strong>
                <span class="badge badge-${lvl.id}">${esc(lvl.cefr)}</span>
              </div>
              <span style="font-size:0.78rem;color:var(--muted);font-weight:600;">${lDone}/${list.length} materi · Skor: ${best}%</span>
            </div>
            <p style="margin:0 0 14px;font-size:0.85rem;color:var(--muted);">${esc(lvl.subtitle)}</p>
            <div class="grid-2">
              <button class="btn btn-tonal" onclick="exploreLevel('${lvl.id}')">📖 Materi</button>
              <button class="btn" style="background:${colorVar};color:#fff;" onclick="startLevelQuiz('${lvl.id}')">🎯 Latihan</button>
            </div>
          </div>
        `;
      }).join('');

      return `
        <section class="hero-card">
          <div class="hero-badge">✨ Kuasai 16 Tenses Bahasa Inggris</div>
          <h2 class="hero-title">Belajar Struktur Waktu dengan Jelas &amp; Terarah</h2>
          <p class="hero-desc">Penjelasan detail, diagram garis waktu visual, rumus verbal &amp; nominal, contoh kalimat beraudio, dan latihan soal interaktif offline.</p>
        </section>

        <section class="card">
          <div class="row-between">
            <div>
              <div style="font-size:0.78rem;color:var(--muted);font-weight:600;">Progres Penguasaan</div>
              <div style="font-family:var(--font-display);font-size:1.15rem;font-weight:800;">${done} dari ${TENSES.length} Tenses Dipahami</div>
            </div>
            <div class="num-pill" style="width:48px;height:48px;border-radius:50%;background:var(--primary-container);color:var(--on-primary-container);">${pct}%</div>
          </div>
          <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
          <div class="row">
