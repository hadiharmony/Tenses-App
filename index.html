    function renderQuiz() {
      const q = appState.quiz;
      if (!q) return renderPracticeHub();

      if (q.finished) {
        const pct = Math.round((q.correctCount / q.questions.length) * 100);
        const headline = pct >= 90 ? 'Luar Biasa! Penguasaan Sempurna' :
                         pct >= 70 ? 'Kerja Bagus! Pemahamanmu Kuat' :
                         pct >= 50 ? 'Cukup Baik! Terus Berlatih' : 'Awal yang Bagus! Yuk Ulas Materinya';
        return `
          <section class="card" style="text-align:center;">
            <div style="font-size:3rem;">🏆</div>
            <div style="font-family:var(--font-display);font-size:2.6rem;font-weight:800;color:var(--primary);">${pct}%</div>
            <h2 style="margin:4px 0 14px;font-size:1.2rem;">${headline}</h2>
            <div class="row" style="margin-bottom:16px;">
              <div class="stat-pill" style="justify-content:center;text-align:center;">
                <div><strong style="color:var(--success);font-size:1.15rem;">${q.correctCount}/${q.questions.length}</strong><small>Benar</small></div>
              </div>
              <div class="stat-pill" style="justify-content:center;text-align:center;">
                <div><strong style="color:var(--gold);font-size:1.15rem;">${q.bestStreak}x</strong><small>Streak Terbaik</small></div>
              </div>
            </div>
            <div class="grid-2">
              <button class="btn btn-tonal" onclick="restartQuiz()">🔄 Ulangi</button>
              <button class="btn btn-primary" onclick="goBack()">Selesai</button>
            </div>
          </section>

          <h3 class="section-title">Ulasan Setiap Soal</h3>
          ${q.records.map((rec, idx) => `
            <div class="card" style="border-color:${rec.ok ? 'var(--success)' : 'var(--error)'};">
              <div class="row-between" style="margin-bottom:6px;">
                <strong style="font-size:0.84rem;color:${rec.ok ? 'var(--success)' : 'var(--error)'};">
                  ${rec.ok ? '✅' : '❌'} Soal #${idx + 1} · ${esc(rec.question.tenseName)}
                </strong>
                <button class="speak-btn" onclick="speakText(${esc(JSON.stringify(rec.question.spoken))})" aria-label="Dengarkan">🔊</button>
              </div>
              <div style="font-weight:700;font-size:0.95rem;margin-bottom:4px;">${esc(rec.question.spoken)}</div>
              ${!rec.ok ? `<div style="font-size:0.82rem;color:var(--error);margin-bottom:4px;">Jawabanmu: ${esc(rec.userAns)}</div>` : ''}
              <p style="margin:0;font-size:0.82rem;color:var(--muted);">${esc(rec.question.exp)}</p>
            </div>
          `).join('')}
        `;
      }

      const cur = q.questions[q.index];
      const pct = Math.round(((q.index + (q.checked ? 1 : 0)) / q.questions.length) * 100);
      const typeLabel = cur.type === 'mc' ? 'Pilihan Ganda' : cur.type === 'spot' ? 'Temukan Kesalahan' : 'Susun Kalimat';
      const lvl = levelMeta(cur.level);

      let inputHTML = '';
      if (cur.type === 'mc') {
        const letters = ['A', 'B', 'C', 'D'];
        inputHTML = `<div style="display:flex;flex-direction:column;gap:10px;">` +
          cur.options.map((opt, idx) => {
            const isSel = q.selected === opt;
            const isRight = opt.toLowerCase() === cur.ans.toLowerCase();
            let cls = 'quiz-option';
            if (q.checked && isRight) cls += ' correct';
            else if (q.checked && isSel && !isRight) cls += ' wrong';
            else if (isSel) cls += ' selected';
            return `
              <button class="${cls}" ${q.checked ? 'disabled' : ''} onclick="selectQuizOption(${idx})">
                <span class="opt-letter">${letters[idx]}</span>
                <span style="flex:1;">${esc(opt)}</span>
                ${q.checked && isRight ? '<span>✅</span>' : (q.checked && isSel ? '<span>❌</span>' : '')}
              </button>
            `;
          }).join('') + `</div>`;
      } else if (cur.type === 'spot') {
        inputHTML = `
          <div>
            <div style="font-size:0.84rem;font-weight:700;color:var(--muted);margin-bottom:10px;">Pilih potongan kata/frasa yang SALAH:</div>
            <div class="spot-wrap">
              ${cur.options.map((opt, idx) => {
                const isSel = q.selected === opt;
                const isRight = opt.toLowerCase() === cur.ans.toLowerCase();
                let cls = 'spot-chip';
                if (q.checked && isRight) cls += ' correct';
                else if (q.checked && isSel && !isRight) cls += ' wrong';
                else if (isSel) cls += ' selected';
                return `<button class="${cls}" ${q.checked ? 'disabled' : ''} onclick="selectQuizOption(${idx})">${esc(opt)}</button>`;
              }).join('')}
            </div>
          </div>
        `;
      } else {
        const remaining = [...cur.bank];
        q.assembled.forEach(w => {
          const idx = remaining.indexOf(w);
          if (idx >= 0) remaining.splice(idx, 1);
        });
        const zoneCls = 'builder-zone' + (q.checked ? (q.isCorrect ? ' correct' : ' wrong') : '');
        inputHTML = `
          <div style="display:flex;flex-direction:column;gap:12px;">
            <div class="row-between">
              <span style="font-size:0.84rem;font-weight:700;color:var(--muted);">Susunan Kalimatmu:</span>
              ${q.assembled.length && !q.checked ? '<button style="color:var(--primary);font-weight:700;font-size:0.82rem;" onclick="clearBuilderWords()">⌫ Bersihkan</button>' : ''}
            </div>
            <div class="${zoneCls}">
              ${q.assembled.length
                ? q.assembled.map((w, idx) => `<button class="word-token placed" ${q.checked ? 'disabled' : ''} onclick="removeBuilderWord(${idx})">${esc(w)}</button>`).join('')
                : '<span style="font-size:0.86rem;color:var(--muted);">Ketuk kata-kata di bawah secara berurutan...</span>'}
            </div>
            <div style="font-size:0.8rem;font-weight:700;color:var(--muted);">Bank Kata (Ketuk untuk menambahkan):</div>
            <div style="display:flex;flex-wrap:wrap;gap:8px;">
              ${remaining.map((w, idx) => `<button class="word-token" ${q.checked ? 'disabled' : ''} onclick="addBuilderWord(${idx})">${esc(w)}</button>`).join('')}
            </div>
          </div>
        `;
      }

      const canCheck = cur.type === 'builder' ? q.assembled.length > 0 : !!q.selected;
      const isLast = q.index + 1 >= q.questions.length;

      return `
        <div>
          <div class="row-between" style="font-size:0.8rem;color:var(--muted);font-weight:700;margin-bottom:6px;">
            <span>Soal ${q.index + 1} dari ${q.questions.length}</span>
            ${q.streak > 0 ? `<span style="color:var(--gold);">🔥 Streak ${q.streak}x</span>` : ''}
          </div>
          <div class="progress-track" style="margin:0;"><div class="progress-fill" style="width:${pct}%"></div></div>
        </div>

        <section class="card">
          <div class="row" style="gap:6px;margin-bottom:10px;">
            <span class="badge" style="background:var(--primary-container);color:var(--on-primary-container);">${typeLabel}</span>
            <span class="badge badge-${cur.level}">${esc(lvl.label)}</span>
          </div>
          <p style="margin:0 0 10px;font-size:0.84rem;color:var(--muted);">${esc(cur.inst)}</p>
          <div style="font-family:var(--font-display);font-size:1.2rem;font-weight:700;line-height:1.4;">${esc(cur.prompt)}</div>
        </section>

        ${inputHTML}

        ${q.checked ? `
          <section class="feedback-card ${q.isCorrect ? 'ok' : 'bad'}">
            <div class="row-between" style="margin-bottom:8px;">
              <strong style="font-size:1rem;color:${q.isCorrect ? 'var(--success)' : 'var(--error)'};">
                ${q.isCorrect ? '✅ Jawaban Tepat!' : '❌ Belum Tepat'}
              </strong>
              <button class="speak-btn" onclick="speakText(${esc(JSON.stringify(cur.spoken))})" aria-label="Dengarkan kalimat benar">🔊</button>
            </div>
            ${!q.isCorrect ? `<div style="font-weight:800;font-size:0.92rem;margin-bottom:6px;">Jawaban benar: ${esc(cur.ans)}</div>` : ''}
            <p style="margin:0 0 10px;font-size:0.88rem;">${esc(cur.exp)}</p>
            <div class="formula-box" style="background:var(--card);">
              <div style="font-family:var(--font-body);font-size:0.72rem;color:var(--muted);margin-bottom:2px;">Kunci Rumus · ${esc(cur.tenseName)}</div>
              <div style="color:var(--primary);">${esc(cur.hint)}</div>
            </div>
          </section>
        ` : ''}

        <div style="margin-top:4px;">
          ${!q.checked
            ? `<button class="btn btn-primary btn-full" ${canCheck ? '' : 'disabled'} onclick="checkQuizAnswer()">Periksa Jawaban</button>`
            : `<button class="btn ${q.isCorrect ? 'btn-success' : 'btn-primary'} btn-full" onclick="nextQuizQuestion()">${isLast ? 'Lihat Hasil' : 'Soal Berikutnya →'}</button>`}
        </div>
      `;
    }

    function renderReference() {
      const tab = appState.refTab;
      const savedList = TENSES.filter(t => appState.progress.bookmarks.includes(t.id));
      let bodyHTML = '';

      if (tab === 0) {
        bodyHTML = TIME_CATEGORIES.map(c => {
          const list = TENSES.filter(t => t.category === c.id);
          return `
            <div class="card">
              <div class="row" style="margin-bottom:12px;">
                <span class="badge badge-${c.id}" style="font-size:0.82rem;padding:5px 11px;">${esc(c.label)}</span>
                <span style="font-size:0.82rem;color:var(--muted);">${esc(c.sub)}</span>
              </div>
              <div style="display:flex;flex-direction:column;gap:8px;">
                ${list.map(t => `
                  <button onclick="openTense('${t.id}')" style="text-align:left;background:var(--surface);border-radius:14px;padding:12px;width:100%;">
                    <div class="row-between" style="margin-bottom:4px;">
                      <strong style="font-size:0.9rem;">${t.number}. ${esc(t.name)}</strong>
                      <span style="font-size:0.74rem;font-weight:700;color:${catColorVar(c.id)};">${esc(t.aspect)}</span>
                    </div>
                    <div style="font-family:var(--font-mono);font-size:0.82rem;font-weight:600;color:${catColorVar(c.id)};">${esc(t.formula.vp)}</div>
                  </button>
                `).join('')}
              </div>
            </div>
          `;
        }).join('');
      } else if (tab === 1) {
        bodyHTML = COMPARISONS.map(cmp => `
          <div class="card" style="display:flex;flex-direction:column;gap:10px;">
            <strong style="font-size:1.02rem;">⇄ ${esc(cmp.title)}</strong>
            <p style="margin:0;font-size:0.86rem;color:var(--muted);">${esc(cmp.diff)}</p>
            <div class="row-between" style="background:var(--surface);padding:10px 12px;border-radius:14px;">
              <div>
                <div style="font-size:0.72rem;font-weight:800;color:var(--present);">${esc(cmp.a)}</div>
                <div style="font-weight:700;font-size:0.92rem;">${esc(cmp.exA)}</div>
                <div style="font-size:0.78rem;color:var(--muted);">${esc(cmp.mA)}</div>
              </div>
              <button class="speak-btn" onclick="speakText(${esc(JSON.stringify(cmp.exA))})" aria-label="Dengarkan">🔊</button>
            </div>
            <div class="row-between" style="background:var(--surface);padding:10px 12px;border-radius:14px;">
              <div>
                <div style="font-size:0.72rem;font-weight:800;color:var(--past);">${esc(cmp.b)}</div>
                <div style="font-weight:700;font-size:0.92rem;">${esc(cmp.exB)}</div>
                <div style="font-size:0.78rem;color:var(--muted);">${esc(cmp.mB)}</div>
              </div>
              <button class="speak-btn" onclick="speakText(${esc(JSON.stringify(cmp.exB))})" aria-label="Dengarkan">🔊</button>
            </div>
            <div class="tip-card" style="padding:10px 12px;font-size:0.82rem;">💡 ${esc(cmp.trick)}</div>
          </div>
        `).join('');
      } else {
        bodyHTML = savedList.length ? savedList.map(renderTenseCard).join('') : `
          <div class="empty-state card">
            <div style="font-size:2.4rem;">☆</div>
            <h3 style="margin:8px 0 4px;color:var(--ink);">Belum Ada Tense Tersimpan</h3>
            <p style="margin:0;font-size:0.86rem;">Ketuk ikon bintang pada materi tense mana pun untuk menyimpannya agar mudah diulas kembali.</p>
          </div>
        `;
      }

      return `
        <div>
          <h2 class="section-title" style="font-size:1.4rem;">Peta &amp; Ringkasan Tenses</h2>
          <p class="section-sub">Ringkasan cepat rumus 16 tenses, perbandingan tense yang mirip, dan daftar simpanan.</p>
        </div>
        <div class="tabs-bar">
          <button class="seg-tab ${tab === 0 ? 'active' : ''}" onclick="appState.refTab=0;render();">Matriks 16</button>
          <button class="seg-tab ${tab === 1 ? 'active' : ''}" onclick="appState.refTab=1;render();">Perbandingan</button>
          <button class="seg-tab ${tab === 2 ? 'active' : ''}" onclick="appState.refTab=2;render();">Favorit (${savedList.length})</button>
        </div>
        <div style="display:flex;flex-direction:column;gap:14px;">${bodyHTML}</div>
      `;
    }

    function updateTopBarAndNav() {
      const isSub = appState.route === 'detail' || appState.route === 'quiz';
      document.getElementById('bottomNav').classList.toggle('hidden', isSub);

      const brandMini = document.getElementById('topBarLeft');
      const customTitle = document.getElementById('topBarCustomTitle');

      if (isSub) {
        brandMini.style.display = 'none';
        customTitle.style.display = 'flex';
        if (appState.route === 'detail') {
          const t = TENSES.find(x => x.id === appState.detailTenseId) || TENSES[0];
          customTitle.innerHTML = `
            <button class="icon-btn" onclick="goBack()" aria-label="Kembali">←</button>
            <div style="min-width:0;">
              <div style="font-size:0.7rem;font-weight:800;color:${catColorVar(t.category)};">Materi #${String(t.number).padStart(2, '0')}</div>
              <div style="font-weight:800;font-size:0.96rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${esc(t.name)}</div>
            </div>
          `;
        } else {
          customTitle.innerHTML = `
            <button class="icon-btn" onclick="goBack()" aria-label="Tutup kuis">✕</button>
            <div style="min-width:0;">
              <div style="font-weight:800;font-size:0.94rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${esc(appState.quiz ? appState.quiz.title : 'Latihan')}</div>
            </div>
          `;
        }
      } else {
        brandMini.style.display = '';
        customTitle.style.display = 'none';
      }

      document.querySelectorAll('[data-route]').forEach(el => {
        el.classList.toggle('active', el.getAttribute('data-route') === appState.route);
      });
    }

    function render() {
      updateTopBarAndNav();
      const root = document.getElementById('appContent');
      if (appState.route === 'home') root.innerHTML = renderHome();
      else if (appState.route === 'learn') root.innerHTML = renderLearn();
      else if (appState.route === 'practice') root.innerHTML = renderPracticeHub();
      else if (appState.route === 'reference') root.innerHTML = renderReference();
      else if (appState.route === 'detail') root.innerHTML = renderDetail();
      else if (appState.route === 'quiz') root.innerHTML = renderQuiz();
    }

    // =========================================================================
    // 6. PWA INSTALL PROMPT, OFFLINE STATUS & SERVICE WORKER REGISTRATION
    // =========================================================================
    let deferredInstallPrompt = null;

    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredInstallPrompt = e;
      document.getElementById('topInstallBtn').classList.add('visible');
      document.getElementById('railInstallBtn').style.display = 'inline-flex';
    });

    window.addEventListener('appinstalled', () => {
      deferredInstallPrompt = null;
      document.getElementById('topInstallBtn').classList.remove('visible');
      document.getElementById('railInstallBtn').style.display = 'none';
    });

    async function triggerInstall() {
      if (!deferredInstallPrompt) return;
      deferredInstallPrompt.prompt();
      await deferredInstallPrompt.userChoice;
      deferredInstallPrompt = null;
      document.getElementById('topInstallBtn').classList.remove('visible');
      document.getElementById('railInstallBtn').style.display = 'none';
    }

    function updateNetworkBadge() {
      const badge = document.getElementById('networkBadge');
      if (!badge) return;
      if (navigator.onLine) {
        badge.textContent = 'Siap Offline';
        badge.classList.remove('offline');
      } else {
        badge.textContent = 'Mode Offline';
        badge.classList.add('offline');
      }
    }

    window.addEventListener('online', updateNetworkBadge);
    window.addEventListener('offline', updateNetworkBadge);

    if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1')) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
      });
    }

    applyTheme();
    updateNetworkBadge();
    render();
  </script>
</body>
</html>
